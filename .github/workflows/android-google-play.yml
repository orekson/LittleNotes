name: Android checks - Google Play variant

on:
  push:
    branches: [codex/google-play-version]
    paths:
      - 'app_TO_googleplay/**'
      - '.github/workflows/android-google-play.yml'
  pull_request:
    paths:
      - 'app_TO_googleplay/**'
      - '.github/workflows/android-google-play.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app_TO_googleplay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and verify
        run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: google-play-verification-reports
          path: app_TO_googleplay/app/build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: LittleNotes-google-play-debug-apk
          path: app_TO_googleplay/app/build/outputs/apk/debug/app-debug.apk
